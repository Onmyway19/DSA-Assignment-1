syntax = "proto3";

package accommodation;

service RentalService {
    rpc AddProperty (Property) returns (PropertyResponse);
    rpc CreateUsers (stream UserProfile) returns (UserCreationSummary);
    rpc UpdateProperty (Property) returns (PropertyResponse);
    rpc RemoveProperty (RemovePropertyRequest) returns (PropertyList);
    rpc ListAvailableProperties (SearchFilter) returns (stream Property);
    rpc SearchProperty (PropertySearchRequest) returns (PropertyDetailsResponse);
    rpc BookProperty (BookingRequest) returns (BookingCartResponse);
    rpc ConfirmBooking (ConfirmationRequest) returns (BookingConfirmation);
}

message Property {
    string property_id = 1;
    string name = 2;
    string location = 3;
    string property_type = 4;
    double price_per_night = 5;
    string status = 6;
}

message PropertyResponse {
    string property_id = 1;
    string status_message = 2;
}

message UserProfile {
    string username = 1;
    string role = 2; 
    string email = 3;
}

message UserCreationSummary {
    string status = 1;
    int32 total_registered = 2;
}

message RemovePropertyRequest {
    string property_id = 1;
    string region = 2;
}

message PropertyList {
    repeated Property properties = 1;
}

message SearchFilter {
    string location = 1;
    double max_price = 2;
}

message PropertySearchRequest {
    string property_id = 1;
}

message PropertyDetailsResponse {
    string status = 1; 
    Property property = 2;
}


message BookingRequest {
    string property_id = 1;
    string check_in_date = 2; 
    string check_out_date = 3;
    string guest_username = 4;
}

message BookingCartResponse {
    string status = 1;
    string message = 2;
}

message ConfirmationRequest {
    string guest_username = 1;
    string property_id = 2;
}

message BookingConfirmation {
    string booking_id = 1;
    double total_cost = 2;
    string message = 3;
}
